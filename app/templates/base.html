<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ groom.nickname }} & {{ bride.nickname }} · {{ e.title }}</title>
  <meta name="description" content="You are cordially invited to the {{ e.title }} of {{ groom.name }} & {{ bride.name }}">
  <meta property="og:title" content="{{ groom.nickname }} & {{ bride.nickname }} · {{ e.title }}">
  <meta property="og:description" content="{{ e.date_display }} · {{ e.venue_name }}, {{ e.city }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% block head %}{% endblock %}
  <!-- Prototype: Tailwind Play CDN for layout utilities. Swap for a compiled build before production. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/themes/' ~ e.theme ~ '.css') }}">
</head>
<body class="theme-{{ e.theme }}">
  <a href="#main" class="skip-link">Skip to invitation</a>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', path='js/invitation.js') }}" defer></script>
</body>
</html>
