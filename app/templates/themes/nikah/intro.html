<div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
  <div class="door door-left" aria-hidden="true"><div class="door-arch"></div></div>
  <div class="door door-right" aria-hidden="true"><div class="door-arch"></div></div>
  <div class="intro-content">
    <svg class="w-14 h-14 mx-auto mb-4 crescent-float" aria-hidden="true"><use href="#crescent"/></svg>
    <p class="arabic text-3xl sm:text-4xl gold-text mb-3" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
    <h1 id="intro-title" class="font-script text-5xl sm:text-6xl text-ink">{{ groom.nickname }} <span class="gold-text">&amp;</span> {{ bride.nickname }}</h1>
    <p class="eyebrow mt-3">Request the honour of your presence</p>
    <button id="open-invite" type="button" class="btn-gold mt-8">Open Invitation</button>
  </div>
</div>
