<div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
  <div class="intro-content">
    <p class="arabic text-2xl sm:text-3xl gold-text" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
    <p class="eyebrow mt-2">You are invited to the</p>
    <h1 id="intro-title" class="font-script text-5xl sm:text-6xl gold-text shimmer mt-1">Valima</h1>
    <div class="envelope">
      <div class="env-back" aria-hidden="true"></div>
      <div class="env-letter" aria-hidden="true">{{ groom.nickname }} &amp; {{ bride.nickname }}</div>
      <div class="env-front" aria-hidden="true"></div>
      <div class="env-flap" aria-hidden="true"></div>
      <button id="open-invite" type="button" class="btn-seal">
        <span class="monogram" aria-hidden="true">{{ groom.nickname[0] }}&amp;{{ bride.nickname[0] }}</span>
        <span class="seal-cta">Open</span>
        <span class="sr-only">Open the Valima invitation</span>
      </button>
    </div>
    <p class="font-serif italic text-ink-soft mt-6">Tap the seal to open</p>
  </div>
</div>
