<section class="section" aria-labelledby="rsvp-title">
  <svg class="divider reveal" aria-hidden="true"><use href="#divider"/></svg>
  <h2 id="rsvp-title" class="section-title text-center reveal">Kindly Respond</h2>
  <p class="font-serif text-center text-ink-soft text-lg -mt-2 mb-6 reveal">Your presence and duas would mean the world to us.</p>

  <div id="rsvp-area" class="rsvp-panel reveal">
    <form hx-post="/{{ e.slug }}/rsvp" hx-target="#rsvp-feedback" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]"
          class="grid gap-5 sm:grid-cols-2" novalidate>
      <div class="sm:col-span-2">
        <label for="full_name" class="field-label">Full name <span aria-hidden="true">*</span></label>
        <input id="full_name" name="full_name" type="text" required minlength="2" maxlength="120" autocomplete="name" class="field-input" aria-required="true">
      </div>
      <div>
        <label for="email" class="field-label">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" class="field-input">
      </div>
      <div>
        <label for="phone" class="field-label">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" class="field-input">
      </div>

      <fieldset class="sm:col-span-2">
        <legend class="field-label">Will you be joining us? <span aria-hidden="true">*</span></legend>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-1">
          <label class="choice">
            <input type="radio" name="attending" value="yes" required>
            <span>InshaAllah, I'll be there</span>
          </label>
          <label class="choice">
            <input type="radio" name="attending" value="no">
            <span>Sorry, I can't make it</span>
          </label>
        </div>
      </fieldset>

      <div id="guest-wrap">
        <label for="guest_count" class="field-label">Number of guests (incl. you)</label>
        <select id="guest_count" name="guest_count" class="field-input">
          {% for n in range(1, 11) %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
        </select>
      </div>

      <div class="sm:col-span-2">
        <label for="message" class="field-label">Duas &amp; wishes for the couple</label>
        <textarea id="message" name="message" rows="3" maxlength="1000" class="field-input"></textarea>
      </div>

      <div class="sm:col-span-2 text-center">
        <button type="submit" class="btn-gold">
          <span class="btn-label">Send RSVP</span>
          <span class="htmx-indicator" aria-hidden="true">Sending…</span>
        </button>
      </div>
    </form>
    <div id="rsvp-feedback" role="status" aria-live="polite" class="mt-4"></div>
  </div>
</section>
