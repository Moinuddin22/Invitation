{% macro person(p, side) -%}
<div class="reveal reveal-{{ side }}">
  <p class="font-script text-6xl sm:text-7xl gold-text shimmer leading-tight">{{ p.name }}</p>
  <p class="eyebrow text-sm mt-1">( {{ p.nickname }} )</p>
  <p class="font-serif italic text-ink-soft mt-2 text-base sm:text-lg">{{ p.parent_line }}</p>
</div>
{%- endmacro %}

<section class="section text-center" aria-labelledby="couple-title">
  <h2 id="couple-title" class="sr-only">The Couple</h2>
  <div class="couple-grid">
    {{ person(groom, "left") }}
    <div class="reveal ampersand-wrap" aria-hidden="true">
      <svg class="w-12 h-12 mx-auto crescent-float"><use href="#crescent"/></svg>
      <span class="font-script text-5xl gold-text">weds</span>
    </div>
    {{ person(bride, "right") }}
  </div>

  <figure class="ayah-panel reveal mt-10">
    <blockquote>
      <p class="arabic text-2xl sm:text-3xl leading-loose text-panel-ink" lang="ar" dir="rtl">{{ e.quote.arabic }}</p>
      <p class="font-serif italic text-panel-ink text-base sm:text-lg mt-4">“{{ e.quote.english }}”</p>
    </blockquote>
    <figcaption class="font-display text-xs tracking-[.25em] text-panel-ink mt-3 uppercase">{{ e.quote.reference }}</figcaption>
  </figure>
</section>
